INHERIT: ../../../mkdocs-common.yml

site_name: Console
site_url: https://athenaframework.org/Console/
repo_url: https://github.com/athena-framework/console

nav:
  - Introduction: README.md
  - Back to Manual: project://.
  - API:
      - Aliases: aliases.md
      - Top Level: top_level.md
      - '*'

plugins:
  - search
  - section-index
  - literate-nav
  - gen-files:
      scripts:
        - ../../../gen_doc_stubs.py
  - mkdocstrings:
      default_handler: crystal
      custom_templates: ../../../docs/templates
      handlers:
        crystal:
          crystal_docs_flags:
            - ../../../docs/index.cr
            - ./lib/athena-clock/src/athena-clock.cr
            - ./lib/athena-dependency_injection/src/athena-dependency_injection.cr
            - ./lib/athena-console/src/athena-console.cr
            - ./lib/athena-console/src/bundle/bundle.cr
            - ./lib/athena-console/src/bundle/application.cr
            - ./lib/athena-console/src/bundle/compiler_passes/register_commands.cr
            - ./lib/athena-console/src/bundle/container_command_loader.cr
            - ./lib/athena-console/src/spec.cr
          source_locations:
            lib/athena-console: https://github.com/athena-framework/console/blob/v{shard_version}/{file}#L{line}

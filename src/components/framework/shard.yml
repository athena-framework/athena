name: athena

version: 0.22.0

crystal: ~> 1.19

license: MIT

repository: https://github.com/athena-framework/athena

documentation: https://athenaframework.org/Framework

description: |
  A web framework comprised of reusable, independent components.

authors:
  - George Dietrich <dev@dietrich.pub>

dependencies:
  athena-contracts:
    github: athena-framework/contracts
    version: ~> 0.1.0
  athena-dependency_injection:
    github: athena-framework/dependency-injection
    version: ~> 0.4.0
  athena-event_dispatcher:
    github: athena-framework/event-dispatcher
    version: ~> 0.4.0
  athena-http:
    github: athena-framework/http
    version: ~> 0.1.0
  athena-http_kernel:
    github: athena-framework/http-kernel
    version: ~> 0.1.0
  athena-routing:
    github: athena-framework/routing
    version: ~> 0.2.0

INHERIT: ../../../mkdocs-common.yml

site_name: ORM
site_url: https://athenaframework.org/ORM/
repo_url: https://github.com/athena-framework/orm

nav:
  - Introduction: README.md
  - Back to Manual: project://.
  - API:
      - Aliases: aliases.md
      - Top Level: top_level.md
      - '*'

plugins:
  - search
  - section-index
  - literate-nav
  - gen-files:
      scripts:
        - ../../../gen_doc_stubs.py
  - mkdocstrings:
      default_handler: crystal
      custom_templates: ../../../docs/templates
      handlers:
        crystal:
          crystal_docs_flags:
            - ../../../docs/index.cr
            - ./lib/athena-contracts/src/event_dispatcher.cr
            - ./lib/athena-contracts/src/service.cr
            - ./lib/athena-dependency_injection/src/athena-dependency_injection.cr
            - ./lib/athena-orm/src/athena-orm.cr
            - ./lib/athena-orm/src/bundle/bundle.cr
            - ./lib/athena-orm/src/bundle/registry.cr
          source_locations:
            lib/athena-orm: https://github.com/athena-framework/orm/blob/v{shard_version}/{file}#L{line}

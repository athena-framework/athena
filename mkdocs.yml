INHERIT: ../../../mkdocs-common.yml

site_name: Password Hasher
site_url: https://athenaframework.org/PasswordHasher/
repo_url: https://github.com/athena-framework/password-hasher

nav:
  - Introduction: README.md
  - Back to Manual: project://.
  - API:
      - Aliases: aliases.md
      - Top Level: top_level.md
      - '*'

plugins:
  - search
  - section-index
  - literate-nav
  - gen-files:
      scripts:
        - ../../../gen_doc_stubs.py
  - mkdocstrings:
      default_handler: crystal
      custom_templates: ../../../docs/templates
      handlers:
        crystal:
          crystal_docs_flags:
            - ../../../docs/index.cr
            - ./lib/athena-console/src/athena-console.cr
            - ./lib/athena-password_hasher/src/athena-password_hasher.cr
          source_locations:
            lib/athena-password_hasher: https://github.com/athena-framework/password-hasher/blob/v{shard_version}/{file}#L{line}
